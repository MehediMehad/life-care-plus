name: CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test-server:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://dummy:password@localhost:5432/testdb"
      JWT_SECRET: "test-secret-for-github-actions"
      REFRESH_TOKEN_SECRET: "dummy_refresh_secret"
      EXPIRES_IN: "7d"
      REFRESH_TOKEN_EXPIRES_IN: "1y"
      NODE_ENV: "test"
      REDIS_URL: "redis://localhost:6379"
      STRIPE_SECRET_KEY: "sk_test_dummy"
      VAPID_PUBLIC_KEY: "BHyvtbxc9BtoUF6er5Wo70AWCiC7F8F5HxrfrEcIu5SAspPUz4KYdTNyu1GepLJ8nGa-bUHi4Bfm_8EMUvSRjJ0"
      VAPID_PRIVATE_KEY: "SyRbalVthuYUkeFpzTXLTSf997jt40ND_mJD2AfQNiE"
      VAPID_SUBJECT: "mailto:test@example.com"
      GOOGLE_CLIENT_ID: "dummy_google_id"
      GOOGLE_CLIENT_SECRET: "dummy_google_secret"
      GOOGLE_CALLBACK_URL: "http://localhost:5000/api/v1/auth/google/callback"
      FACEBOOK_APP_ID: "dummy_facebook_id"
      FACEBOOK_APP_SECRET: "dummy_facebook_secret"
      FACEBOOK_CALLBACK_URL: "http://localhost:5000/api/v1/auth/facebook/callback"
      EXPRESS_SESSION_SECRET: "dummy_session_secret"
      TWILIO_ACCOUNT_SID: "dummy_twilio_sid"
      TWILIO_AUTH_TOKEN: "dummy_twilio_token"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Server Dependencies
        run: cd server && npm install

      - name: Generate Prisma Client
        run: cd server && npm run prisma:generate

      - name: Run Server Tests
        run: cd server && npm run test

  test-client:
    name: Run Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Client Dependencies
        run: cd client && npm install --legacy-peer-deps

      - name: Run Client Tests
        run: cd client && npm run test

  deploy-backend:
    name: Deploy to Render
    needs: [test-server, test-client]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deployment
        run: curl "${{ secrets.RENDER_DEPLOY_HOOK }}"
